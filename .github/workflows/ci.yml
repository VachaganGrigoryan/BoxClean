name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Debloat tool (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  launcher:
    name: Launcher (unit tests, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # The ubuntu image ships the Android SDK and sets ANDROID_HOME.
      - run: ./gradlew testReleaseUnitTest lintRelease assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: boxclean-home-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
